spring.application.name=student-management-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management}
spring.datasource.username=${DB_USERNAME:student_app}
spring.datasource.password=${DB_PASSWORD:student_local_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
